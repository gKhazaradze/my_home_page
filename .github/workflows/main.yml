name: Deploy (Platform edge)

on:
  push:
    branches: [master]
  workflow_dispatch:  # allow manual triggering from the GitHub UI

concurrency:
  group: deploy-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Syntax-check homepage JS
        run: |
          # Fail fast if the registry / renderers are broken before shipping
          node -c site/projects.js
          node -c site/render.js
          node -c site/landing.js
          node -c site/theme.js
          # A broken service worker is worse than none: the installed Android
          # app keeps running the last GOOD worker, so a syntax error here ships
          # silently and only shows up as a stale app days later.
          node -c site/sw.js
          node -c site/pwa.js

      - name: Validate app manifest + asset links
        run: |
          # The Android app (android/) is generated from these two files. Both
          # are hand-edited JSON with no build step, so a stray comma would
          # otherwise only surface as a failed install on the phone.
          jq -e . site/manifest.webmanifest > /dev/null

          # Chrome will not drop the URL bar unless assetlinks.json names the
          # exact package + signing fingerprint the APK was built with.
          jq -e '
            type == "array" and length > 0
            and (.[0].relation | index("delegate_permission/common.handle_all_urls"))
            and .[0].target.namespace == "android_app"
            and (.[0].target.package_name | length > 0)
            and (.[0].target.sha256_cert_fingerprints
                 | length > 0 and all(test("^([0-9A-F]{2}:){31}[0-9A-F]{2}$")))
          ' site/.well-known/assetlinks.json > /dev/null

          # Every project subdomain is its own origin and needs the file served
          # on it, which is what `import assetlinks` does. A project block that
          # forgets it still works in a browser but opens with a URL bar in the
          # app — easy to miss, so fail the build instead.
          #
          # NOTE the `-` in the character class. Hyphens are legal in DNS labels
          # and this repo already runs a container called `bus-tracker`, so a
          # `bus-tracker.{$DOMAIN}` block is one copy-paste away. Without the
          # hyphen the host simply doesn't match and the block is skipped
          # SILENTLY — the check passes while the project is unprotected.
          missing=0
          while read -r host; do
            [ "$host" = "www" ] && continue
            awk -v h="$host" '
              $0 ~ "^"h"\\.\\{\\$DOMAIN\\} \\{" { inblock = 1 }
              inblock && /import assetlinks/    { found = 1 }
              inblock && /^\}/                  { exit }
              END { exit !found }
            ' caddy/Caddyfile || { echo "MISSING 'import assetlinks' in block: $host"; missing=1; }
          done < <(grep -oE '^[a-z0-9-]+\.\{\$DOMAIN\}' caddy/Caddyfile | cut -d. -f1)
          [ "$missing" = 0 ] || exit 1

          # The edge serving assetlinks is necessary but NOT sufficient: the app
          # also has to declare the origin as trusted. Two lists in two files
          # that must stay identical, so compare them.
          #
          # This also catches the classic additionalTrustedOrigins mistake —
          # entries must be BARE HOSTNAMES. A "https://roadtrip..." entry yields
          # a first label of "https://roadtrip", which won't match and fails here
          # rather than silently restoring the URL bar on the phone.
          edge=$(grep -oE '^[a-z0-9-]+\.\{\$DOMAIN\}' caddy/Caddyfile \
                 | cut -d. -f1 | grep -vx www | sort -u)
          app=$(jq -r '.additionalTrustedOrigins[]' android/twa-manifest.json \
                | cut -d. -f1 | sort -u)
          if [ "$edge" != "$app" ]; then
            echo "Caddyfile project subdomains and android/twa-manifest.json disagree:"
            diff <(echo "$edge") <(echo "$app") | sed 's/^/  /' || true
            echo "  (< = edge only, > = app only)"
            exit 1
          fi

          echo "manifest + asset links OK; edge and app trust the same origins"

      - name: Validate Caddyfile
        run: |
          # Caddy reads {$DOMAIN}/{$ACME_EMAIL} from the environment; supply
          # dummies so validation can resolve them.
          docker run --rm \
            -e DOMAIN=example.com -e ACME_EMAIL=ci@example.com \
            -v "$PWD/caddy:/etc/caddy:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate compose file
        run: |
          # docker-compose.yml has `env_file: .env`; provide a throwaway one so
          # `config` can resolve it (the real .env lives on the server).
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          rm -f .env

      - name: Deploy over SSH (the box runs deploy/on-box.sh at this commit)
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # This repo's own key signs in as the box's unprivileged `deploy` user,
          # which pins it to one command: deploy this app at the commit sent
          # (my_home_page/deploy/box). No script travels from here — the box
          # runs deploy/on-box.sh as committed on the branch — and the host key
          # is pinned, so a stolen key or a man in the middle gets at most a
          # redeploy of what is already on main (security fix plan 5.4).
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$EC2_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFe7pJ2Ic/SxJmjzozAvmblXVkDJGrokHVRc0yLcMGTD' > ~/.ssh/known_hosts
          ssh -n -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "deploy@$EC2_HOST" "$GITHUB_SHA"

      - name: Post-deploy public health check
        run: |
          # Verify the homepage is reachable over HTTPS at the real domain.
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 5 "https://${{ secrets.PLATFORM_DOMAIN }}/" > /dev/null; then
              echo "Homepage healthy over HTTPS"
              exit 0
            fi
            sleep 3
          done
          echo "Public homepage not responding"
          exit 1

      - name: Post-deploy asset-links check
        run: |
          # The edge change exists so the Android app can open every project
          # full-screen. Chrome grants that per ORIGIN, so assert the file on the
          # apex AND on each project subdomain, against the live edge.
          #
          # Status alone is NOT enough. citywatch is an nginx SPA whose catch-all
          # answers 200 with index.html for unknown paths, so a status-only probe
          # would go green while Chrome received HTML and refused to verify. And
          # a stale file would verify fine while pointing at the wrong signing
          # key. So assert the body parses AND that the fingerprint matches the
          # one in this commit.
          domain="${{ secrets.PLATFORM_DOMAIN }}"
          want=$(jq -r '.[0].target.sha256_cert_fingerprints[0]' site/.well-known/assetlinks.json)

          hosts="$domain"
          for sub in $(grep -oE '^[a-z0-9-]+\.\{\$DOMAIN\}' caddy/Caddyfile | cut -d. -f1); do
            [ "$sub" = "www" ] && continue
            hosts="$hosts $sub.$domain"
          done

          # Retry per host: a single dropped connection is a flaky network, not a
          # broken deploy, and failing the whole run on one blip trains everyone
          # to ignore this check. Only a consistent failure is a real one.
          failed=0
          for h in $hosts; do
            url="https://$h/.well-known/assetlinks.json"
            reason=""
            for attempt in 1 2 3 4 5; do
              reason=""
              code=$(curl -s --max-time 15 -o /tmp/al.json -w '%{http_code}' "$url" || echo 000)
              if [ "$code" != "200" ]; then
                reason="HTTP $code"
              else
                got=$(jq -r '.[0].target.sha256_cert_fingerprints[0] // empty' /tmp/al.json 2>/dev/null || true)
                if [ -z "$got" ]; then
                  reason="200 but the body is not asset-links JSON (SPA fallback?)"
                elif [ "$got" != "$want" ]; then
                  reason="serving a DIFFERENT signing fingerprint than this commit"
                fi
              fi
              [ -z "$reason" ] && break
              sleep 3
            done
            if [ -n "$reason" ]; then
              echo "FAIL $h — $reason"; failed=1
            else
              echo "OK   $h"
            fi
          done

          [ "$failed" = 0 ] || {
            echo "Asset links are broken on at least one origin."
            echo "The site is fine, but the Android app will show a URL bar there."
            exit 1
          }
          echo "Asset links verified on every origin"
