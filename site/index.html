<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>George — my calendar &amp; my projects</title>

<!-- Social link previews -->
<meta property="og:type" content="website" />
<meta property="og:title" content="George — my calendar &amp; my projects" />
<meta property="og:description" content="My calendar and my projects" />

<!-- Inline SVG favicon: the ▸ mark in the accent blue (no extra asset) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='86' fill='%232563eb'%3E%E2%96%B8%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />

<!-- Apply the saved theme before first paint to avoid a flash (light is the default) -->
<script>(function(){try{if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="logo">
      <span class="logo-mark">▸</span>
      <span class="logo-text">GeorgeLands</span>
    </a>
    <div class="nav-right">
      <div class="nav-meta">making things happen</div>
      <button class="nav-btn theme-toggle" id="theme-toggle" type="button" title="Switch to dark mode" aria-label="Switch to dark mode">☾</button>
    </div>
  </div>
</nav>


<!-- The page's heading. The design has no visible title — the two panels carry
     it — but the document still needs an h1 for heading navigation. -->
<h1 class="visually-hidden">George — my calendar and my projects</h1>

<!-- The two doors. Copy here is the pre-JS fallback; landing.js re-syncs it to
     the registry in projects.js and fills in the host-derived calendar link. -->
<main class="split">

  <a class="split-side" id="side-calendar" aria-label="Open My Calendar">
    <div class="side-top">
      <span class="side-kicker">my time</span>
      <span class="badge badge-live" id="calendar-status">live</span>
    </div>
    <h2 class="side-title" id="calendar-title">My Calendar</h2>
    <p class="side-blurb" id="calendar-blurb">Where I'm going and when</p>
    <div class="side-preview">
      <img class="side-shot" id="calendar-shot" src="assets/availability.svg" alt="" loading="lazy" onerror="this.remove()">
    </div>
    <span class="side-cta">Check my calendar <span class="side-arrow" aria-hidden="true">→</span></span>
  </a>

  <!-- Not a link itself: each preview row below is its own link straight to the
       project, so a visitor can open one without the /projects.html detour. The
       CTA at the bottom is the link to the full grid. -->
  <section class="split-side split-side-plain" aria-labelledby="projects-heading">
    <div class="side-top">
      <span class="side-kicker">my work</span>
      <span class="side-count" id="project-count"></span>
    </div>
    <h2 class="side-title" id="projects-heading">Projects</h2>
    <p class="side-blurb">Random things I build — click one to open it</p>
    <div class="side-preview">
      <ul class="side-list" id="project-list"><!-- rows injected by landing.js --></ul>
    </div>
    <a class="side-cta" href="/projects.html">See all projects <span class="side-arrow" aria-hidden="true">→</span></a>
  </section>

</main>

<footer class="site-footer">
  <div class="footer-inner">
    <nav class="footer-links">
      <a href="/contact.html" class="footer-link">Contact Us</a>
      <a href="/privacy.html" class="footer-link">Privacy Policy</a>
    </nav>
    <span class="footer-meta">GeorgeLands&copy; 2026 All Rights Reserved</span>
  </div>
</footer>

<script src="projects.js"></script>
<script src="landing.js"></script>
<script src="theme.js"></script>
</body>
</html>
