<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Tbilisi bus tracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#e7ecf3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
    <filter id="popshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1f2937" flood-opacity="0.28"/>
    </filter>
    <clipPath id="card">
      <rect x="120" y="110" width="1040" height="500" rx="26"/>
    </clipPath>
    <!-- a bus: direction arrow, exactly how the map layer draws one -->
    <g id="bus">
      <path d="M 0,-13 L 10,11 L 0,3 L -10,11 Z" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- The card is drawn on the same 1040x500 grid as availability.svg, then
       scaled up about the centre so it fills more of the 16:9 thumbnail (the
       card grid stays readable; only the outer margin shrinks). -->
  <g transform="translate(640,360) scale(1.12) translate(-640,-360)">

  <!-- app card -->
  <rect x="120" y="110" width="1040" height="500" rx="26" fill="#ffffff" filter="url(#shadow)"/>

  <g clip-path="url(#card)">
    <!-- ── map (right of the panel) ───────────────────────────────────── -->
    <rect x="420" y="110" width="740" height="500" fill="#e8e6e1"/>

    <!-- parks -->
    <path d="M 470,132 C 560,120 600,180 556,232 C 500,280 432,244 452,180 Z" fill="#dbe7cf"/>
    <path d="M 1010,470 C 1100,452 1160,500 1140,562 C 1120,616 1010,610 992,552 Z" fill="#dbe7cf"/>

    <!-- the Mtkvari -->
    <path d="M 452,110 C 520,232 566,300 620,420 C 668,524 700,566 736,610"
          fill="none" stroke="#a9c9e8" stroke-width="30" stroke-linecap="round" opacity="0.9"/>

    <!-- minor streets -->
    <g fill="none" stroke="#ffffff" stroke-width="5" opacity="0.65">
      <path d="M 420,300 C 560,322 720,296 860,330 C 980,358 1080,344 1160,358"/>
      <path d="M 420,392 C 580,414 700,388 840,414 C 970,438 1080,424 1160,438"/>
      <path d="M 596,110 C 618,250 590,390 626,610"/>
      <path d="M 848,110 C 868,232 832,378 876,610"/>
      <path d="M 1076,110 C 1092,236 1060,378 1104,610"/>
    </g>

    <!-- arterials -->
    <g fill="none" stroke="#ffffff" stroke-width="9.5" opacity="0.9" stroke-linecap="round">
      <path d="M 420,468 C 560,452 700,478 830,442 C 950,410 1060,430 1160,404"/>
      <path d="M 420,214 C 580,242 760,210 900,242 C 1020,270 1090,256 1160,270"/>
      <path d="M 470,110 C 496,240 540,340 566,610"/>
      <path d="M 700,110 C 728,260 690,400 736,610"/>
      <path d="M 960,110 C 982,250 940,360 1000,610"/>
      <path d="M 420,566 C 600,586 760,556 900,582 C 1020,604 1090,592 1160,602"/>
    </g>

    <!-- ── routes ─────────────────────────────────────────────────────── -->
    <!-- traced path of the selected route: translucent halo, then the line -->
    <path d="M 620,596 C 660,470 730,420 806,392 C 900,356 980,300 1010,168"
          fill="none" stroke="#DC3D3E" stroke-width="15" opacity="0.2" stroke-linecap="round"/>

    <path d="M 452,556 C 540,500 590,430 690,404 C 790,378 860,320 916,236"
          fill="none" stroke="#00B38B" stroke-width="5" opacity="0.92" stroke-linecap="round"/>
    <path d="M 470,180 C 570,240 640,250 742,318 C 840,384 930,404 1132,430"
          fill="none" stroke="#0033B4" stroke-width="5" opacity="0.92" stroke-linecap="round"/>
    <path d="M 620,596 C 660,470 730,420 806,392 C 900,356 980,300 1010,168"
          fill="none" stroke="#DC3D3E" stroke-width="5" stroke-linecap="round"/>

    <!-- ── buses (arrows point the way they're travelling) ─────────────── -->
    <g fill="#00B38B">
      <use href="#bus" transform="translate(505,518) rotate(52)"/>
      <use href="#bus" transform="translate(660,410) rotate(78)"/>
      <use href="#bus" transform="translate(830,352) rotate(40)"/>
      <use href="#bus" transform="translate(905,262) rotate(20)"/>
    </g>
    <g fill="#0033B4">
      <use href="#bus" transform="translate(556,232) rotate(122)"/>
      <use href="#bus" transform="translate(742,318) rotate(130)"/>
      <use href="#bus" transform="translate(900,398) rotate(100)"/>
      <use href="#bus" transform="translate(1060,424) rotate(95)"/>
    </g>
    <g fill="#DC3D3E">
      <use href="#bus" transform="translate(652,492) rotate(15)"/>
      <use href="#bus" transform="translate(760,404) rotate(65)"/>
      <use href="#bus" transform="translate(880,364) rotate(45)"/>
      <use href="#bus" transform="translate(990,250) rotate(8)"/>
    </g>

    <!-- popup on the pinned bus -->
    <g filter="url(#popshadow)">
      <path d="M 985,220 L 1005,220 L 995,233 Z" fill="#ffffff"/>
      <rect x="870" y="120" width="250" height="100" rx="10" fill="#ffffff"/>
    </g>
    <path d="M 870,120 h 230 a 10,10 0 0 1 10,10 v 18 h -250 v -18 a 10,10 0 0 1 10,-10 z" fill="#DC3D3E"/>
    <rect x="884" y="130" width="30" height="9" rx="4.5" fill="#ffffff" opacity="0.95"/>
    <rect x="924" y="130" width="74" height="9" rx="4.5" fill="#ffffff" opacity="0.6"/>
    <rect x="884" y="164" width="150" height="10" rx="5" fill="#45494e"/>
    <rect x="884" y="186" width="196" height="8" rx="4" fill="#c7ccd3"/>
    <rect x="884" y="202" width="120" height="8" rx="4" fill="#c7ccd3"/>

    <!-- ── side panel ─────────────────────────────────────────────────── -->
    <rect x="120" y="110" width="300" height="500" fill="#ffffff"/>
    <line x1="420" y1="110" x2="420" y2="610" stroke="#e5e7eb" stroke-width="2"/>

    <!-- header: title + live status -->
    <rect x="148" y="140" width="190" height="16" rx="8" fill="#1c1e21"/>
    <circle cx="155" cy="177" r="5" fill="#00B38B"/>
    <rect x="167" y="172" width="126" height="10" rx="5" fill="#9aa0a6"/>

    <!-- route filter box -->
    <rect x="148" y="200" width="244" height="34" rx="8" fill="#ffffff" stroke="#d7dae0" stroke-width="2"/>
    <rect x="163" y="212" width="152" height="10" rx="5" fill="#c7ccd3"/>

    <!-- route chips (the selected one carries the route colour) -->
    <g>
      <rect x="148" y="252" width="74" height="26" rx="13" fill="#DC3D3E"/>
      <rect x="160" y="261" width="26" height="8" rx="4" fill="#ffffff"/>
      <rect x="194" y="261" width="14" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
    </g>
    <g fill="none" stroke="#d7dae0" stroke-width="2">
      <rect x="233" y="252" width="74" height="26" rx="13"/>
      <rect x="318" y="252" width="74" height="26" rx="13"/>
      <rect x="148" y="288" width="74" height="26" rx="13"/>
      <rect x="233" y="288" width="74" height="26" rx="13"/>
      <rect x="318" y="288" width="74" height="26" rx="13"/>
      <rect x="148" y="324" width="74" height="26" rx="13"/>
      <rect x="233" y="324" width="74" height="26" rx="13"/>
      <rect x="318" y="324" width="74" height="26" rx="13"/>
      <rect x="148" y="360" width="74" height="26" rx="13"/>
      <rect x="233" y="360" width="74" height="26" rx="13"/>
      <rect x="318" y="360" width="74" height="26" rx="13"/>
      <rect x="148" y="396" width="74" height="26" rx="13"/>
      <rect x="233" y="396" width="74" height="26" rx="13"/>
      <rect x="318" y="396" width="74" height="26" rx="13"/>
      <rect x="148" y="432" width="74" height="26" rx="13"/>
      <rect x="233" y="432" width="74" height="26" rx="13"/>
      <rect x="318" y="432" width="74" height="26" rx="13"/>
    </g>
    <g fill="#45494e">
      <rect x="245" y="261" width="26" height="8" rx="4"/><rect x="330" y="261" width="26" height="8" rx="4"/>
      <rect x="160" y="297" width="26" height="8" rx="4"/><rect x="245" y="297" width="26" height="8" rx="4"/><rect x="330" y="297" width="26" height="8" rx="4"/>
      <rect x="160" y="333" width="26" height="8" rx="4"/><rect x="245" y="333" width="26" height="8" rx="4"/><rect x="330" y="333" width="26" height="8" rx="4"/>
      <rect x="160" y="369" width="26" height="8" rx="4"/><rect x="245" y="369" width="26" height="8" rx="4"/><rect x="330" y="369" width="26" height="8" rx="4"/>
      <rect x="160" y="405" width="26" height="8" rx="4"/><rect x="245" y="405" width="26" height="8" rx="4"/><rect x="330" y="405" width="26" height="8" rx="4"/>
      <rect x="160" y="441" width="26" height="8" rx="4"/><rect x="245" y="441" width="26" height="8" rx="4"/><rect x="330" y="441" width="26" height="8" rx="4"/>
    </g>
    <g fill="#c7ccd3">
      <rect x="279" y="261" width="14" height="8" rx="4"/><rect x="364" y="261" width="14" height="8" rx="4"/>
      <rect x="194" y="297" width="14" height="8" rx="4"/><rect x="279" y="297" width="14" height="8" rx="4"/><rect x="364" y="297" width="14" height="8" rx="4"/>
      <rect x="194" y="333" width="14" height="8" rx="4"/><rect x="279" y="333" width="14" height="8" rx="4"/><rect x="364" y="333" width="14" height="8" rx="4"/>
      <rect x="194" y="369" width="14" height="8" rx="4"/><rect x="279" y="369" width="14" height="8" rx="4"/><rect x="364" y="369" width="14" height="8" rx="4"/>
      <rect x="194" y="405" width="14" height="8" rx="4"/><rect x="279" y="405" width="14" height="8" rx="4"/><rect x="364" y="405" width="14" height="8" rx="4"/>
      <rect x="194" y="441" width="14" height="8" rx="4"/><rect x="279" y="441" width="14" height="8" rx="4"/><rect x="364" y="441" width="14" height="8" rx="4"/>
    </g>

    <!-- panel footer: the bus / minibus legend -->
    <line x1="148" y1="492" x2="392" y2="492" stroke="#eceff3" stroke-width="2"/>
    <circle cx="154" cy="522" r="6" fill="#00B38B"/>
    <rect x="168" y="517" width="40" height="9" rx="4.5" fill="#c7ccd3"/>
    <circle cx="240" cy="522" r="6" fill="#0033B4"/>
    <rect x="254" y="517" width="64" height="9" rx="4.5" fill="#c7ccd3"/>
    <rect x="148" y="548" width="244" height="8" rx="4" fill="#e3e7ec"/>
    <rect x="148" y="566" width="176" height="8" rx="4" fill="#e3e7ec"/>
  </g>

  <!-- card border on top (un-clipped so the stroke isn't halved) -->
  <rect x="120" y="110" width="1040" height="500" rx="26" fill="none" stroke="#e5e7eb" stroke-width="2"/>

  </g>
</svg>
