<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="CityWatch — a wall of live camera feeds">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#e7ecf3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
    <clipPath id="card">
      <rect x="120" y="110" width="1040" height="500" rx="26"/>
    </clipPath>

    <!-- one clip per feed tile, so every scene keeps the rounded corner -->
    <clipPath id="tA"><rect x="160" y="246" width="304" height="160" rx="14"/></clipPath>
    <clipPath id="tB"><rect x="488" y="246" width="304" height="160" rx="14"/></clipPath>
    <clipPath id="tC"><rect x="816" y="246" width="304" height="160" rx="14"/></clipPath>
    <clipPath id="tD"><rect x="160" y="430" width="304" height="160" rx="14"/></clipPath>
    <clipPath id="tE"><rect x="488" y="430" width="304" height="160" rx="14"/></clipPath>
    <clipPath id="tF"><rect x="816" y="430" width="304" height="160" rx="14"/></clipPath>

    <!-- each feed is somewhere else in the world, so each is at its own hour -->
    <linearGradient id="gDay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="gDusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gSavanna" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="gHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- the recording dot every tile carries -->
    <g id="livedot">
      <circle r="5.5" fill="#ef4444"/>
    </g>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- app card, on the same 1040x500 grid as the other thumbnails -->
  <rect x="120" y="110" width="1040" height="500" rx="26" fill="#ffffff" filter="url(#shadow)"/>

  <g clip-path="url(#card)">
    <!-- header band: dark, because this one is a video app -->
    <rect x="120" y="110" width="1040" height="96" fill="#0f172a"/>
    <rect x="158" y="140" width="220" height="36" rx="18" fill="#ffffff" opacity="0.92"/>

    <!-- the solar readout: each city's own sun position -->
    <circle cx="900" cy="158" r="12" fill="#f59e0b"/>
    <rect x="924" y="152" width="48" height="12" rx="6" fill="#ffffff" opacity="0.35"/>

    <!-- LIVE badge -->
    <rect x="1006" y="142" width="114" height="32" rx="16" fill="#ef4444"/>
    <circle cx="1026" cy="158" r="6" fill="#ffffff"/>
    <rect x="1040" y="152" width="60" height="12" rx="6" fill="#ffffff" opacity="0.95"/>

    <!-- ── Feed 1: a city centre at midday ─────────────────────────────── -->
    <g clip-path="url(#tA)">
      <rect x="160" y="246" width="304" height="160" fill="#0f172a"/>
      <rect x="160" y="246" width="304" height="108" fill="url(#gDay)"/>
      <g fill="#0b1220">
        <rect x="176" y="330" width="40" height="76"/>
        <rect x="224" y="306" width="34" height="100"/>
        <rect x="266" y="346" width="46" height="60"/>
        <rect x="320" y="318" width="38" height="88"/>
        <rect x="366" y="352" width="40" height="54"/>
        <rect x="414" y="330" width="44" height="76"/>
        <rect x="160" y="396" width="304" height="10"/>
      </g>
    </g>
    <use href="#livedot" x="180" y="266"/>
    <rect x="174" y="380" width="88" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ── Feed 2: the one you've opened in theater mode ────────────────── -->
    <g clip-path="url(#tB)">
      <rect x="488" y="246" width="304" height="160" fill="#0f172a"/>
      <rect x="488" y="246" width="304" height="120" fill="url(#gDusk)"/>
      <circle cx="600" cy="330" r="18" fill="#fde68a" opacity="0.95"/>
      <g fill="#0b1220">
        <rect x="504" y="336" width="44" height="70"/>
        <rect x="556" y="312" width="36" height="94"/>
        <rect x="600" y="352" width="40" height="54"/>
        <rect x="648" y="324" width="46" height="82"/>
        <rect x="702" y="344" width="38" height="62"/>
        <rect x="748" y="316" width="36" height="90"/>
        <rect x="488" y="396" width="304" height="10"/>
      </g>
    </g>
    <use href="#livedot" x="508" y="266"/>
    <rect x="502" y="380" width="88" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
    <!-- selection ring, drawn outside the clip so the stroke isn't halved -->
    <rect x="484" y="242" width="312" height="168" rx="18" fill="none" stroke="#2563eb" stroke-width="5"/>

    <!-- ── Feed 3: a beach cam ──────────────────────────────────────────── -->
    <g clip-path="url(#tC)">
      <rect x="816" y="246" width="304" height="160" fill="#0f172a"/>
      <rect x="816" y="246" width="304" height="84" fill="url(#gDay)"/>
      <circle cx="1064" cy="284" r="15" fill="#fff7ed" opacity="0.92"/>
      <rect x="816" y="330" width="304" height="44" fill="url(#gSea)"/>
      <rect x="816" y="374" width="304" height="32" fill="#e7c9a0"/>
      <g fill="#ffffff" opacity="0.4">
        <rect x="846" y="344" width="64" height="5" rx="2.5"/>
        <rect x="930" y="356" width="52" height="5" rx="2.5"/>
        <rect x="1000" y="346" width="58" height="5" rx="2.5"/>
      </g>
      <circle cx="1046" cy="388" r="11" fill="#ef4444" opacity="0.85"/>
    </g>
    <use href="#livedot" x="836" y="266"/>
    <rect x="830" y="380" width="88" height="8" rx="4" fill="#ffffff" opacity="0.35"/>

    <!-- ── Feed 4: an African waterhole ─────────────────────────────────── -->
    <g clip-path="url(#tD)">
      <rect x="160" y="430" width="304" height="160" fill="#0f172a"/>
      <rect x="160" y="430" width="304" height="80" fill="url(#gSavanna)"/>
      <rect x="160" y="510" width="304" height="80" fill="#4d7c0f"/>
      <ellipse cx="340" cy="558" rx="88" ry="20" fill="#0ea5e9" opacity="0.8"/>
      <g fill="#0b1220">
        <rect x="210" y="486" width="64" height="28" rx="13"/>
        <circle cx="284" cy="482" r="13"/>
        <rect x="218" y="510" width="7" height="30"/>
        <rect x="236" y="510" width="7" height="30"/>
        <rect x="250" y="510" width="7" height="30"/>
        <rect x="266" y="510" width="7" height="30"/>
      </g>
    </g>
    <use href="#livedot" x="180" y="450"/>
    <rect x="174" y="564" width="88" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ── Feed 5: somewhere it's the middle of the night ───────────────── -->
    <g clip-path="url(#tE)">
      <rect x="488" y="430" width="304" height="160" fill="url(#gNight)"/>
      <g fill="#ffffff" opacity="0.5">
        <circle cx="546" cy="456" r="2"/>
        <circle cx="620" cy="446" r="1.6"/>
        <circle cx="700" cy="462" r="2"/>
        <circle cx="760" cy="444" r="1.6"/>
      </g>
      <g fill="#111827">
        <rect x="504" y="500" width="48" height="90"/>
        <rect x="560" y="470" width="40" height="120"/>
        <rect x="608" y="510" width="52" height="80"/>
        <rect x="668" y="486" width="44" height="104"/>
        <rect x="720" y="505" width="52" height="85"/>
      </g>
      <g fill="#fbbf24" opacity="0.8">
        <rect x="514" y="514" width="7" height="9"/>
        <rect x="530" y="514" width="7" height="9"/>
        <rect x="514" y="532" width="7" height="9"/>
        <rect x="568" y="486" width="7" height="9"/>
        <rect x="582" y="486" width="7" height="9"/>
        <rect x="568" y="504" width="7" height="9"/>
        <rect x="582" y="504" width="7" height="9"/>
        <rect x="568" y="522" width="7" height="9"/>
        <rect x="618" y="526" width="7" height="9"/>
        <rect x="634" y="526" width="7" height="9"/>
        <rect x="678" y="500" width="7" height="9"/>
        <rect x="694" y="500" width="7" height="9"/>
        <rect x="678" y="518" width="7" height="9"/>
        <rect x="694" y="518" width="7" height="9"/>
        <rect x="730" y="520" width="7" height="9"/>
        <rect x="746" y="520" width="7" height="9"/>
        <rect x="730" y="538" width="7" height="9"/>
      </g>
    </g>
    <use href="#livedot" x="508" y="450"/>
    <rect x="502" y="564" width="88" height="8" rx="4" fill="#ffffff" opacity="0.3"/>

    <!-- ── Feed 6: a landmark ───────────────────────────────────────────── -->
    <g clip-path="url(#tF)">
      <rect x="816" y="430" width="304" height="160" fill="url(#gHaze)"/>
      <rect x="816" y="550" width="304" height="40" fill="#475569"/>
      <g fill="#0b1220">
        <rect x="846" y="516" width="40" height="34"/>
        <rect x="1052" y="524" width="44" height="26"/>
        <path d="M 938,550 L 958,470 L 978,470 L 998,550 Z"/>
        <rect x="963" y="440" width="10" height="32"/>
        <rect x="944" y="502" width="48" height="9"/>
      </g>
    </g>
    <use href="#livedot" x="836" y="450"/>
    <rect x="830" y="564" width="88" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- card border on top (un-clipped so the stroke isn't halved) -->
  <rect x="120" y="110" width="1040" height="500" rx="26" fill="none" stroke="#e5e7eb" stroke-width="2"/>
</svg>
