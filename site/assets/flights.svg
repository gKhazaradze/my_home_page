<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Flight tracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#e7ecf3"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe9f8"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
    <filter id="popshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1f2937" flood-opacity="0.28"/>
    </filter>
    <clipPath id="card">
      <rect x="120" y="110" width="1040" height="500" rx="26"/>
    </clipPath>
    <!-- a plane, nose pointing +x, drawn on a ~40u grid -->
    <g id="plane">
      <path d="M 22,0 L 8,4 L -10,3 L -18,10 L -22,10 L -17,2 L -22,1 L -26,4 L -30,4 L -26,0 L -30,-4 L -26,-4 L -22,-1 L -17,-2 L -22,-10 L -18,-10 L -10,-3 L 8,-4 Z"/>
    </g>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Same 1040x500 card grid as the other thumbnails, scaled about the centre -->
  <g transform="translate(640,360) scale(1.12) translate(-640,-360)">

  <!-- app card -->
  <rect x="120" y="110" width="1040" height="500" rx="26" fill="#ffffff" filter="url(#shadow)"/>

  <g clip-path="url(#card)">
    <!-- ── sky / route view (right of the panel) ───────────────────────── -->
    <rect x="420" y="110" width="740" height="500" fill="url(#sky)"/>

    <!-- faint clouds -->
    <g fill="#ffffff" opacity="0.75">
      <ellipse cx="560" cy="200" rx="64" ry="18"/>
      <ellipse cx="608" cy="188" rx="40" ry="14"/>
      <ellipse cx="1030" cy="260" rx="74" ry="20"/>
      <ellipse cx="1082" cy="248" rx="44" ry="15"/>
      <ellipse cx="700" cy="480" rx="56" ry="16"/>
    </g>

    <!-- ground strip at the bottom: the arrival airport -->
    <path d="M 420,540 C 600,522 840,556 1160,532 L 1160,610 L 420,610 Z" fill="#dbe7cf"/>
    <!-- runway -->
    <g transform="translate(980,568) rotate(-4)">
      <rect x="-120" y="-13" width="240" height="26" rx="4" fill="#8d96a3"/>
      <g stroke="#ffffff" stroke-width="4" stroke-dasharray="16 12">
        <line x1="-104" y1="0" x2="104" y2="0"/>
      </g>
    </g>
    <!-- terminal building -->
    <g transform="translate(790,560)">
      <rect x="-56" y="-26" width="112" height="26" rx="5" fill="#b8c0cb"/>
      <rect x="-20" y="-44" width="40" height="20" rx="4" fill="#cdd4dd"/>
      <circle cx="0" cy="-52" r="4" fill="#DC3D3E"/>
    </g>

    <!-- flown part of the route: solid, from the departure edge... -->
    <path d="M 420,208 C 560,170 700,190 812,268"
          fill="none" stroke="#0033B4" stroke-width="6" stroke-linecap="round"/>
    <!-- ...remaining part: dashed, down to the runway -->
    <path d="M 812,268 C 900,330 952,470 972,540"
          fill="none" stroke="#0033B4" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="2 18" opacity="0.85"/>

    <!-- the tracked plane, on the seam, heading down the arc -->
    <use href="#plane" transform="translate(812,268) rotate(38) scale(2.1)" fill="#0033B4"/>

    <!-- a second, untracked flight far off -->
    <path d="M 1160,180 C 1060,196 980,212 900,220" fill="none" stroke="#9aa0a6"
          stroke-width="3.5" stroke-dasharray="2 12" opacity="0.55" stroke-linecap="round"/>
    <use href="#plane" transform="translate(900,220) rotate(184) scale(1.3)" fill="#9aa0a6" opacity="0.6"/>

    <!-- countdown popup pinned to the tracked plane (sits up-left of it) -->
    <g filter="url(#popshadow)">
      <path d="M 780,248 L 804,248 L 808,262 Z" fill="#ffffff"/>
      <rect x="640" y="148" width="212" height="100" rx="10" fill="#ffffff"/>
    </g>
    <path d="M 650,148 h 192 a 10,10 0 0 1 10,10 v 16 h -212 v -16 a 10,10 0 0 1 10,-10 z" fill="#0033B4"/>
    <rect x="654" y="157" width="34" height="9" rx="4.5" fill="#ffffff" opacity="0.95"/>
    <rect x="696" y="157" width="58" height="9" rx="4.5" fill="#ffffff" opacity="0.6"/>
    <!-- the countdown: big and bold, the point of the app -->
    <rect x="654" y="188" width="118" height="16" rx="8" fill="#1c1e21"/>
    <rect x="780" y="191" width="48" height="10" rx="5" fill="#00B38B"/>
    <rect x="654" y="220" width="96" height="8" rx="4" fill="#c7ccd3"/>
    <rect x="760" y="220" width="52" height="8" rx="4" fill="#c7ccd3"/>

    <!-- ── side panel: the tracked-flight list ─────────────────────────── -->
    <rect x="120" y="110" width="300" height="500" fill="#ffffff"/>
    <line x1="420" y1="110" x2="420" y2="610" stroke="#e5e7eb" stroke-width="2"/>

    <!-- header: title + push status -->
    <rect x="148" y="140" width="170" height="16" rx="8" fill="#1c1e21"/>
    <circle cx="155" cy="177" r="5" fill="#00B38B"/>
    <rect x="167" y="172" width="112" height="10" rx="5" fill="#9aa0a6"/>

    <!-- add-a-flight box with button -->
    <rect x="148" y="200" width="176" height="34" rx="8" fill="#ffffff" stroke="#d7dae0" stroke-width="2"/>
    <rect x="162" y="212" width="94" height="10" rx="5" fill="#c7ccd3"/>
    <rect x="332" y="200" width="60" height="34" rx="8" fill="#0033B4"/>
    <rect x="346" y="212" width="32" height="10" rx="5" fill="#ffffff"/>

    <!-- flight card 1: the active one (blue accent, countdown, 3/2/1 dots) -->
    <rect x="148" y="254" width="244" height="128" rx="12" fill="#ffffff" stroke="#0033B4" stroke-width="2.5"/>
    <rect x="162" y="268" width="58" height="12" rx="6" fill="#1c1e21"/>
    <rect x="228" y="270" width="70" height="9" rx="4.5" fill="#9aa0a6"/>
    <rect x="318" y="266" width="60" height="16" rx="8" fill="#e3ebff"/>
    <rect x="162" y="292" width="150" height="18" rx="9" fill="#0033B4"/>
    <rect x="162" y="322" width="104" height="8" rx="4" fill="#c7ccd3"/>
    <rect x="274" y="322" width="56" height="8" rx="4" fill="#c7ccd3"/>
    <!-- reminder dots: 3h 2h sent, 1h pending -->
    <g transform="translate(162,348)">
      <rect x="0" y="0" width="36" height="18" rx="9" fill="#00B38B"/>
      <rect x="42" y="0" width="36" height="18" rx="9" fill="#00B38B"/>
      <rect x="84" y="0" width="36" height="18" rx="9" fill="none" stroke="#d7dae0" stroke-width="2"/>
    </g>

    <!-- flight card 2: further out, plain -->
    <rect x="148" y="398" width="244" height="96" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <rect x="162" y="412" width="52" height="12" rx="6" fill="#45494e"/>
    <rect x="222" y="414" width="64" height="9" rx="4.5" fill="#9aa0a6"/>
    <rect x="318" y="410" width="60" height="16" rx="8" fill="#eef0f3"/>
    <rect x="162" y="436" width="112" height="14" rx="7" fill="#45494e"/>
    <rect x="162" y="462" width="128" height="8" rx="4" fill="#c7ccd3"/>

    <!-- flight card 3: landed (green, dimmed) -->
    <g opacity="0.72">
      <rect x="148" y="510" width="244" height="72" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
      <rect x="162" y="524" width="52" height="12" rx="6" fill="#45494e"/>
      <rect x="318" y="522" width="60" height="16" rx="8" fill="#e0f5ef"/>
      <rect x="162" y="548" width="96" height="10" rx="5" fill="#00B38B"/>
      <rect x="268" y="549" width="72" height="8" rx="4" fill="#c7ccd3"/>
    </g>
  </g>

  <!-- card border on top (un-clipped so the stroke isn't halved) -->
  <rect x="120" y="110" width="1040" height="500" rx="26" fill="none" stroke="#e5e7eb" stroke-width="2"/>

  </g>
</svg>
