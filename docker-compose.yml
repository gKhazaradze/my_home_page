# The platform edge. One container (Caddy) owns host :80/:443: it terminates
# TLS, serves the homepage static files directly, and reverse-proxies each
# project subdomain to a project container by name, over that project's own
# `edge-<name>` network. Projects live in their own repos (CONTRACT.md).
#
#   docker compose up -d            # start the edge + homepage
#   docker compose logs -f caddy    # watch cert issuance / requests
#
# DOMAIN + ACME_EMAIL come from a .env file next to this one (see .env.example).
# The networks must already exist (CI creates any missing):
#   docker network create web; docker network create edge-<name>  # per app

services:
  caddy:
    image: caddy:2-alpine          # upstream image — no build step
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"              # HTTP/3 (open UDP 443 in the SG; harmless if not)
    env_file: .env                 # DOMAIN, ACME_EMAIL — referenced in the Caddyfile
    dns:                           # upstreams for the container's embedded resolver
      - 8.8.8.8                    # on systemd-resolved hosts the 127.0.0.53 stub
      - 1.1.1.1                    # isn't reachable in-container, so ACME (Let's
                                   # Encrypt) DNS lookups fail without this.
                                   # (roadtrip:8000 still resolves via 127.0.0.11.)
    volumes:
      # Mount the DIRECTORY, not the file. A single-file bind mount is resolved
      # by inode, and `git reset --hard` replaces the file (write temp + rename)
      # rather than editing in place — so the container would keep reading the
      # OLD inode and `caddy reload` would report "config is unchanged" after a
      # deploy that looked green. A directory mount resolves per access.
      - ./caddy:/etc/caddy:ro
      - ./site:/srv/site:ro        # homepage static files (served by file_server)
      - caddy_data:/data           # ACME account + issued certs — MUST persist
      - caddy_config:/config
    networks:                     # its own `web`, plus every app's edge network
      - web
      - edge-roadtrip
      - edge-availability
      - edge-bustracker
      - edge-citywatch
      - edge-flights
      - edge-speed
      - edge-oktopus-booker
      - edge-liftmap-api

networks:
  # Each app has its own network, shared with Caddy and nothing else, so one
  # compromised container reaches no other (security fix plan 5.2; see
  # CONTRACT.md). All external: created out-of-band (CI creates any missing).
  web:
    external: true
    name: web
  edge-roadtrip:
    external: true
    name: edge-roadtrip
  edge-availability:
    external: true
    name: edge-availability
  edge-bustracker:
    external: true
    name: edge-bustracker
  edge-citywatch:
    external: true
    name: edge-citywatch
  edge-flights:
    external: true
    name: edge-flights
  edge-speed:
    external: true
    name: edge-speed
  edge-oktopus-booker:
    external: true
    name: edge-oktopus-booker
  edge-liftmap-api:
    external: true
    name: edge-liftmap-api

volumes:
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
